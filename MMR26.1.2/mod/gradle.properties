# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties. The build, the mods.toml and the scripts read the Module's names from here; the
# Java package, MOD_ID and settings.gradle spell mod_id too (ModIdTest checks MOD_ID).
mod_id = mechanicalmasteryreborn
mod_name = Mechanical Mastery Reborn
mod_description = The companion mod of the Mechanical Mastery Reborn modpack: C.O.D., its essences and the lab.
mod_version = 0.1.0
maven_group = io.github.5thlayer
archives_name = mechanicalmasteryreborn

# Minecraft properties
minecraft_version = 26.1.2

# Dependencies
neoforge_version = 26.1.2.77

# Modrinth and CurseForge (docs/agents/releases.md). A Module that never goes to the sites leaves
# both projects empty, and the release task skips the upload. The dependencies are the required
# ones, comma separated: Modrinth project ids, CurseForge slugs. upload_release_type is release, beta or
# alpha for every upload, or empty for beta below 1.0 and release from it; CurseForge's app lists a
# project only once it has a release.
modrinth_project_id =
curseforge_project_id =
modrinth_dependencies =
curseforge_dependencies =
upload_release_type =
