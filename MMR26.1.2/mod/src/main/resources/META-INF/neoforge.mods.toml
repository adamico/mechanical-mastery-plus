modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/adamico/mechanical-mastery-plus/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Module's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# The range is the one libworks { runtime } in build.gradle nests, to the next minor.
[[dependencies.${mod_id}]]
modId = "libworks"
type = "required"
versionRange = "${libworks_runtime_range}"
ordering = "NONE"
side = "BOTH"
