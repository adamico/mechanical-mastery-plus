modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/adamico/mechanical-mastery-plus/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Module's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# The range is the one libworks { runtime } in build.gradle nests, to the next minor.
[[dependencies.${mod_id}]]
modId = "libworks"
type = "required"
versionRange = "${libworks_runtime_range}"
ordering = "NONE"
side = "BOTH"

# The money handicap's halved sales and the money spell's risen prices, applied only with AdminShop installed
# (HandSaleMixin, SellerSaleMixin, PurchaseMixin, BuyerPurchaseMixin).
[[mixins]]
config = "${mod_id}.mixins.json"

# A Transmuted Essence a playing team's machine or Personal Assembler makes is stamped with its attempt (#322).
[[mixins]]
config = "${mod_id}.essence.mixins.json"

# A chain machine from a mix does no work while its chain is locked, applied only with Theurgy installed (#214).
[[mixins]]
config = "${mod_id}.theurgy.mixins.json"

# The life handicap on a player's food data: faster hunger and the Diet (#244).
[[mixins]]
config = "${mod_id}.life.mixins.json"

# A Nether portal made in mid-air, over the Nether's lava sea or the Overworld's void, gets an arrival platform (#264).
[[mixins]]
config = "${mod_id}.portal.mixins.json"

# A home gate opens only on the island of a team that has unlocked protection, applied only with Gateways installed (#238).
[[mixins]]
config = "${mod_id}.gateways.mixins.json"

# A Mutation Chamber climbs no Quartessence into Quintessence until its team has started its last stand, and a Void Crucible never takes one, applied only with Voidworks installed (#262).
[[mixins]]
config = "${mod_id}.voidworks.mixins.json"
