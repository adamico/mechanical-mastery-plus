modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/adamico/mechanical-mastery-plus/issues"
license = "MIT"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Module's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# The range is the one libworks { runtime } in build.gradle nests, to the next minor.
[[dependencies.${mod_id}]]
modId = "libworks"
type = "required"
versionRange = "${libworks_runtime_range}"
ordering = "NONE"
side = "BOTH"

# The money handicap's halved sales, applied only with AdminShop installed (ShopTradesMixin).
[[mixins]]
config = "${mod_id}.mixins.json"

# A chain machine from a mix does no work while its chain is locked, applied only with Theurgy installed (#214).
[[mixins]]
config = "${mod_id}.theurgy.mixins.json"

# A home gate opens only on the island of a team that has unlocked protection, applied only with Gateways installed (#238).
[[mixins]]
config = "${mod_id}.gateways.mixins.json"

# An Ara Vitae or Hellfire Forge from a mix does no work while the life chain is locked, applied only with Neo Vitae installed (#243).
[[mixins]]
config = "${mod_id}.neovitae.mixins.json"
