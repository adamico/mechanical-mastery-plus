version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitattributes",
    "**/*.mods.toml",
    "**/*.md",
    "**/src/main/resources/**/*.json",
    "**/src/gametest/resources/**/*.json",
    "**/src/main/resources/**/*.mcmeta",
    "**/src/main/resources/**/*.mcfunction",
    "**/src/gametest/resources/**/*.mcmeta",
    "**/src/gametest/resources/**/*.mcfunction",
    "**/src/gametest/resources/**/*.nbt",
    "**/src/main/resources/**/*.nbt",
    "LICENSE",
    "NOTICE",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# Mechanical Mastery Plus's own art, by its maintainer, carried over from MMP1.19.2/ (NOTICE): the
# four Mechanical Essences copied as they are, the Transmuted Essences and Quintessence
# recoloured from the Advanced one, Nullessence from Quintessence, and the Quartessence a quarter
# of each Transmuted Essence's. The Obsidian Flakes have no texture of their own, nor the fish on
# C.O.D.'s lid: their models draw vanilla's at runtime (libworks ADR 0012).
[[annotations]]
path = [
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/*_essence.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/nullessence.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/quartessence.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/quintessence.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Andrea D'Amico"
SPDX-License-Identifier = "MIT"

# The Rift Shard, the Charged Rift Shard and the Null Shard, which publish/make-shards.py draws (NOTICE).
[[annotations]]
path = [
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/rift_shard.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/charged_rift.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/null_shard.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# The Recycler's, the Electric Defence's, C.O.D.'s, the lab's, the Ports' and the mint's textures, from Malcolm
# Riley's unused-textures, some modified (NOTICE).
[[annotations]]
path = [
    "src/main/resources/assets/mechanicalmasteryreborn/textures/block/recycler_*.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/block/fe_defence_*.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/block/cod_*.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/block/lab_*.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/block/*_port_*.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/block/molten_*.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/block/molten_*.png.mcmeta",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/*_coin.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/*_cast.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/mold.png",
    "src/main/resources/assets/mechanicalmasteryreborn/textures/item/burnt_sand.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Malcolm Riley"
SPDX-License-Identifier = "CC-BY-4.0"

# The cover and icon publish/make-cover.py draws from the Recycler's textures (NOTICE).
[[annotations]]
path = ["publish/*.png"]
precedence = "override"
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"
