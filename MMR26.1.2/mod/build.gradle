// The Module build, every piece of it from the libworks convention plugin (libworks ADR 0003):
// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing, and the release, upload and buildGametestStructures tasks.
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.4.5'
}

// What the Module requires of other Modules, each as a range (libworks ADR 0003):
libworks {
    // upstream('groundworks') { range = '[0.4.0,0.5)' }
    // Nested by jar-in-jar: the Works tab the whole suite shares, and from 0.1.8 libworks-gametest on
    // the game tests' classpath (5thlayer/libworks ADR 0008).
    runtime = '0.1.8'
    // Spelled out, since the repo holds the pack's tags too (mmp1.19.2-v*, mmr-v*): a release of the
    // mod can never take one of them (AGENTS.md).
    tagPrefix = 'mechanicalmasteryreborn-v'
}

// libworks-runtime and libworks-gametest come from ~/.m2, the one repository the plugin gives every
// io.github.5thlayer module (libworks#18). CI builds the runtime's tag there first.


repositories {
    // EMI for 26.1 is an unofficial port, and Skyblock Builder's 26.1 build is on CurseForge only.
    maven { url = 'https://cursemaven.com' }
    // Jade.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// The pack's versions: EMI's unofficial port, the Jade Craftworks builds against (built on NeoForge
// 26.1.2.76, so it runs on our .77), and Skyblock Builder 26.1.4.
def emi = 'curse.maven:emi-unofficial-port-1544558:8630349'
def jade = 'maven.modrinth:jade:26.1.11+neoforge'
def skyblockBuilder = 'curse.maven:skyblock-builder-446691:9048404'

dependencies {
    // Each optional to players, and named only by its own plugin under compat/, which loads only when
    // the mod is installed: EMI shows decomposing and recycling, Jade a Recycler's progress, and Skyblock
    // Builder says whose island a Recycler stands on. None is on the dev runs, so the game tests prove the
    // mod plays alone; scripts/launch.py plays the local build in the pack, beside all three.
    compileOnly emi
    compileOnly jade
    compileOnly(skyblockBuilder) { transitive = false }
}
