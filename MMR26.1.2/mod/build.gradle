// The Module build, every piece of it from the libworks convention plugin (libworks ADR 0003):
// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing, and the release, upload and buildGametestStructures tasks.
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.4.5'
}

// What the Module requires of other Modules, each as a range (libworks ADR 0003):
libworks {
    // upstream('groundworks') { range = '[0.4.0,0.5)' }
    // Nested by jar-in-jar: the Works tab the whole suite shares, and from 0.1.8 libworks-gametest on
    // the game tests' classpath (5thlayer/libworks ADR 0008).
    runtime = '0.1.8'
    // Spelled out, since the repo holds the pack's tags too (mmp1.19.2-v*, mmr-v*): a release of the
    // mod can never take one of them (AGENTS.md).
    tagPrefix = 'mechanicalmasteryreborn-v'
}

// libworks-runtime and libworks-gametest come from ~/.m2, the one repository the plugin gives every
// io.github.5thlayer module (libworks#18). CI builds the runtime's tag there first.


repositories {
    // EMI for 26.1 is an unofficial port, and Skyblock Builder's 26.1 build is on CurseForge only.
    maven { url = 'https://cursemaven.com' }
    // FTB Teams and the FTB Library it needs.
    maven {
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    // Jade.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// The pack's versions: EMI's unofficial port, the Jade Craftworks builds against (built on NeoForge
// 26.1.2.76, so it runs on our .77), and Skyblock Builder 26.1.4.
def emi = 'curse.maven:emi-unofficial-port-1544558:8630349'
def jade = 'maven.modrinth:jade:26.1.11+neoforge'
def skyblockBuilder = 'curse.maven:skyblock-builder-446691:9048404'
def ftbTeams = 'dev.ftb.mods:ftb-teams-neoforge:26.1.2.4'
def ftbLibrary = 'dev.ftb.mods:ftb-library-neoforge:26.1.2.11'
def ftbChunks = 'dev.ftb.mods:ftb-chunks-neoforge:26.1.2.9'
def chapters = 'curse.maven:chapters-1538047:9306837'
def theurgy = 'curse.maven:theurgy-430636:9359578'
def gateways = 'curse.maven:gateways-to-eternity-417802:8502258'
def placebo = 'curse.maven:placebo-283644:8502256'
def adminShop = 'curse.maven:adminshop-overhauled-876270:9409244'

dependencies {
    // Each optional to players, and named only by its own plugin under compat/, which loads only when
    // the mod is installed: EMI shows decomposing and recycling, Jade a Recycler's progress, Skyblock
    // Builder says whose island a Recycler stands on, and with FTB Teams keeps an island's players in one
    // party. None is on the dev runs, so the game tests prove the mod plays alone; scripts/launch.py plays
    // the local build in the pack, beside them all.
    compileOnly emi
    compileOnly jade
    compileOnly(skyblockBuilder) { transitive = false }
    // FTB Teams, with Skyblock Builder, keeps each island's players in one FTB party (#225).
    compileOnly(ftbTeams) { transitive = false }
    compileOnly(ftbLibrary) { transitive = false }
    // FTB Chunks, whose explosion protection the Assault lifts for its team while it runs (#241).
    compileOnly(ftbChunks) { transitive = false }
    // AdminShop, the money challenge's mod: the money handicap acts on its Accounts and halves its sales (#213).
    compileOnly(adminShop) { transitive = false }
    // Chapters, which locks a challenge's chain until the team starts it (ADR 0007).
    compileOnly(chapters) { transitive = false }
    // Theurgy, the energy challenge's mod: the crafting-behaviour mixins that lock a chain's processing
    // (CraftingBehaviourMixin, MercuryCatalystCraftingBehaviourMixin) compile against its classes (#214, #246).
    compileOnly(theurgy) { transitive = false }
    // Gateways to Eternity, the protection challenge's mod: the Assault opens its gates and clears their mobs
    // (#237), and a home gate opens only on its unlocked team's island (#238).
    compileOnly(gateways) { transitive = false }
    compileOnly(placebo) { transitive = false }

    // The JUnit tests run with no Minecraft, so they read the pack's JSON with the Gson Minecraft ships (#251).
    testImplementation 'com.google.code.gson:gson:2.13.2'
}

// The JUnit tests read the pack's data beside this folder, so a change there runs them again.
tasks.named('test') {
    inputs.dir('../kubejs/data').withPropertyName('packData').withPathSensitivity(PathSensitivity.RELATIVE)
}

// The protection Chain's game tests (#252) run its recipes on a real Assembler, so they need the suite mods the
// Chain stands on: Craftworks' Assembler, Wireworks' steam and plastic and Fieldworks' tar, on Groundworks. They are
// the pack's own jars, from CurseForge as mods/*.pw.toml name them, so a CI runner needs no build of the suite.
// They run on a game test server of their own, suiteGameTestServer, with those mods and the pack's assembling
// recipes as a datapack, suite_pack/; the gameTestServer run keeps none of them, so it still proves the mod plays
// alone. Only the gametest source set, which never ships, names a suite mod.
def craftworks = ['curse.maven:kc00l-craftworks-1715876:9313819', 'curse.maven:groundworks-1717892:9365582']
def suiteMods = craftworks + ['curse.maven:wireworks-1721198:9309889', 'curse.maven:fieldworks-1737485:9319855']
def suiteTestReport = layout.buildDirectory.file('reports/suite-gametest.xml').get().asFile

// The run's classpath is its source set's, as Craftworks' solo run is: one with no code, the mod's own dependencies
// and the game tests', and the suite mods.
sourceSets {
    suite
}

configurations {
    suiteRuntimeOnly.extendsFrom implementation, runtimeOnly, libworksGametest
}

dependencies {
    // The game tests name the Assembler, which stands on Groundworks' footprints.
    craftworks.each { gametestCompileOnly it }
    suiteMods.each { suiteRuntimeOnly it }
    // The newest libworks runtime those mods nest, which they require: a dev run loads the classpath's, not a nested one.
    suiteRuntimeOnly 'io.github.5thlayer:libworks-runtime:0.1.11'
}

neoForge {
    runs {
        suiteGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.suite
            gameDirectory = file('run/suitetest')
            programArguments.addAll '--tests', 'mechanicalmasteryreborn:warding_*', '--report', suiteTestReport.absolutePath
        }
    }

    addModdingDependenciesTo sourceSets.suite
}

// The pack's assembling recipes, copied as they are into suite_pack/, beside its pack.mcmeta in src/gametest/resources,
// which DevPacks switches on in suiteGameTestServer.
def suitePackDir = layout.buildDirectory.dir('generated/suitePack')
def generateSuitePack = tasks.register('generateSuitePack', Sync) {
    from('../kubejs/data/mechanicalmasteryreborn/recipe/assembling') { into 'suite_pack/data/mechanicalmasteryreborn/recipe/assembling' }
    into suitePackDir
}
sourceSets.gametest.resources.srcDir(files(suitePackDir).builtBy(generateSuitePack))

// As runGameTestServer: the report decides, and names each test; a run that ran none fails.
tasks.named('runSuiteGameTestServer') {
    ignoreExitValue = true
    doFirst {
        suiteTestReport.delete()
        suiteTestReport.parentFile.mkdirs()
    }
    doLast {
        if (!suiteTestReport.exists()) throw new GradleException("The suite game test server wrote no report at $suiteTestReport")
        def cases = new groovy.xml.XmlSlurper().parse(suiteTestReport).'**'.findAll { it.name() == 'testcase' }
        if (cases.isEmpty()) throw new GradleException('The suite game test server ran no tests')
        cases.each { logger.lifecycle("${it.failure.size() ? 'FAILED' : 'passed'}  ${it.@name}") }
        def failed = cases.count { it.failure.size() }
        if (failed) throw new GradleException("$failed of ${cases.size()} suite game tests failed")
    }
}
